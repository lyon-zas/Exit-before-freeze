[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.30"
remappings = [
  "reactive-lib/=lib/reactive-lib-omni/src/",
  "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
]
fs_permissions = [{ access = "read-write", path = "../deployments" }]

[invariant]
runs = 64
depth = 32
